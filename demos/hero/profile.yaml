ekf_localization:
  ros__parameters:
    reference_frame_id: map
    robot_frame_id: base_link
    gnss_pose_topic: /gnss_pose
    imu_topic: /sensing/imu/imu_data
    output_publish_mode: imu
    input_qos_depth: 10000
    output_qos_depth: 10000
    input_reorder_window_sec: 2000.0
    input_reorder_drain_sleep_usec: 500
    propagation_model: fast
    gravity_mps2: 9.80665
    use_imu_orientation: false
    use_flat_ground: true
    var_flat_ground_rp: 0.005
    var_imu_w: 0.00001
    var_imu_acc: 0.001
    var_imu_gyro_bias: 0.00000001
    var_imu_acc_bias: 0.00000001
    initial_imu_gyro_bias_covariance: 0.00001
    initial_imu_acc_bias_covariance: 0.001
    initial_position_variance_xy: 0.01
    initial_position_variance_z: 0.01
    initial_velocity_variance_xy: 0.01
    initial_velocity_variance_z: 0.01
    initial_attitude_variance_rp: 0.0001
    initial_attitude_variance_yaw: 0.0001
    max_imu_dt_sec: 0.1
    use_gnss: true
    use_gnss_velocity: false
    var_gnss_xy: 0.3025
    var_gnss_z: 0.1
    use_odom: false
    use_wheel_speed: true
    wheel_speed_topic: /wheel_speed
    wheel_speed_use_nonholonomic_constraints: true
    wheel_speed_propagate_cross_state: true
    var_wheel_speed: 0.0016
    var_wheel_lateral_velocity: 0.01
    var_wheel_vertical_velocity: 0.01
    max_wheel_speed_innovation_mps: 5.0
